<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="funnelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#funnelBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Funnel Stage 1: Traffic Inbound -->
  <rect x="50" y="50" width="500" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="70" y="75" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">1. Targeted Inbound Clicks (Meta / Google)</text>
  <text x="530" y="75" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">10,000 visitors (100%)</text>

  <!-- Funnel Stage 2: Landing Page View -->
  <rect x="80" y="110" width="440" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="100" y="135" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">2. Landing Page Retention (Headline & Hook)</text>
  <text x="500" y="135" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">6,800 visitors (68%)</text>

  <!-- Funnel Leak Alert Area -->
  <rect x="110" y="170" width="380" height="42" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="130" y="195" fill="#fecaca" font-family="sans-serif" font-size="12" font-weight="bold">⚠️ Traditional Drop-off Point (Offer / Form Friction)</text>
  <text x="470" y="195" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">Down to 12% without CRO</text>

  <!-- Funnel Stage 3: Optimized AI Lead Architecture -->
  <rect x="140" y="230" width="320" height="42" rx="8" fill="#064e3b" stroke="#059669" stroke-width="2"/>
  <text x="160" y="255" fill="#ecfdf5" font-family="sans-serif" font-size="12" font-weight="bold">3. Qualified Leads with Dynamic Funnels & Chat</text>
  <text x="440" y="255" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">32% (+20% lift)</text>

  <!-- Title / Legend -->
  <text x="50" y="325" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">[USE CASE VISUAL: Post-Click Lead Leakage & Conversion Rate Optimization]</text>
</svg>
