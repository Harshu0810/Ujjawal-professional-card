<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="2"/>

  <text x="30" y="45" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Full-Funnel Lifecycle Map &amp; Real-time Attribution</text>
  <text x="30" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">End-to-end data pipeline from creative impression to closed revenue</text>

  <!-- Node 1: Creative Ad Hook -->
  <rect x="30" y="110" width="100" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="145" fill="#60a5fa" font-family="sans-serif" font-size="18" text-anchor="middle">🎯</text>
  <text x="80" y="170" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ad Hook</text>
  <text x="80" y="190" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Meta / Google</text>

  <!-- Flow Connector 1 -->
  <line x1="130" y1="165" x2="175" y2="165" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="175,165 168,161 168,169" fill="#3b82f6"/>

  <!-- Node 2: Dynamic Page / QR Scan -->
  <rect x="175" y="110" width="100" height="110" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="225" y="145" fill="#a5b4fc" font-family="sans-serif" font-size="18" text-anchor="middle">⚡</text>
  <text x="225" y="170" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Smart Funnel</text>
  <text x="225" y="190" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Personalized UX</text>

  <!-- Flow Connector 2 -->
  <line x1="275" y1="165" x2="320" y2="165" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="320,165 313,161 313,169" fill="#6366f1"/>

  <!-- Node 3: AI Qualification Drawer -->
  <rect x="320" y="110" width="100" height="110" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="370" y="145" fill="#c084fc" font-family="sans-serif" font-size="18" text-anchor="middle">🤖</text>
  <text x="370" y="170" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AI Qualifier</text>
  <text x="370" y="190" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Real-time Intent</text>

  <!-- Flow Connector 3 -->
  <line x1="420" y1="165" x2="465" y2="165" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="465,165 458,161 458,169" fill="#10b981"/>

  <!-- Node 4: Calendar / Pipeline Win -->
  <rect x="465" y="110" width="105" height="110" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="517" y="145" fill="#34d399" font-family="sans-serif" font-size="18" text-anchor="middle">💼</text>
  <text x="517" y="170" fill="#ecfdf5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">High Intent</text>
  <text x="517" y="190" fill="#a7f3d0" font-family="sans-serif" font-size="8" text-anchor="middle">Booked Call / Deal</text>

  <!-- Bottom Metric summary -->
  <rect x="30" y="245" width="540" height="50" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="275" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Attribution Guarantee:</text>
  <text x="185" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="11">Every dollar in ad spend mapped through pixel &amp; CRM events.</text>

  <!-- Title / Legend -->
  <text x="30" y="335" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">[SAMPLE REFERENCE VISUAL: Inbound Attribution &amp; Pipeline Engine]</text>
</svg>
